{%- if config.storage | default([]) | length > 0 %}
deployments:
  - path: namespace
  - barrier: true
    waitReadinessObjects:
      - kind: Namespace
        name: storage
{%- for storage in config.storage | default([]) %}
  - path: {{ storage.type }}
    recursive: true
    vars:
      - values:
          storage: {{ storage }}
{%- endfor %}
{%- endif %}
