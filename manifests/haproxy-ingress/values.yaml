---
controller:
  ingressClassResource:
    enabled: true
    default: true
    controllerClass: haproxy
  kind: DaemonSet
  config:
    use-proxy-protocol: "true"
  extraArgs:
    watch-ingress-without-class: "true"
  service:
    type: LoadBalancer
    loadBalancerClass: io.cilium/l2-announcer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: ${ip}
      lbipam.cilium.io/sharing-cross-namespace: '*'
      lbipam.cilium.io/sharing-key: share-${ip}
    httpPorts:
      - port: 8080
        targetPort: http
    httpsPorts:
      - port: 8443
        targetPort: https
    extraPorts:
      - port: 80
        targetPort: 8081
      - port: 443
        targetPort: 8444
  tcp:
    8081: "haproxy-ingress/haproxy-ingress:8080::PROXY-V2"
    8444: "haproxy-ingress/haproxy-ingress:8443::PROXY-V2"
    2222: "gitea/gitea-ssh:22::PROXY-V2"
  haproxy:
    enabled: true
  metrics:
    enabled: true
