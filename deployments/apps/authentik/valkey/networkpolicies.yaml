apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey
  namespace: authentik-{{ app.name }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: authentik
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
