apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    kluctl.io/skip-delete: "true"
  name: postgresql
  namespace: gitea-{{ app.name }}
spec:
{% if get_var('app.node') %}
  affinity:
    nodeSelector:
      kubernetes.io/hostname: {{ app.node }}
  inheritedMetadata:
    annotations:
      volume.kubernetes.io/selected-node: {{ app.node }}
{% endif %}
  instances: 1
  enablePDB: false
  storage:
    size: 5Gi
{% if get_var('app.storage_class') %}
    storageClass: hdd
{% endif %}
  bootstrap:
    initdb:
      database: gitea
