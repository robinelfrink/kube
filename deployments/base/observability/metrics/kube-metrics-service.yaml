apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: kube-metrics
  name: kube-metrics
  namespace: kube-system
spec:
  ports:
    - name: etcd
      port: 2381
      protocol: TCP
      targetPort: 2381
    - name: kube-apiserver
      port: 6443
      protocol: TCP
      targetPort: 6443
    - name: kube-scheduler
      port: 10259
      protocol: TCP
      targetPort: 10259
    - name: kube-controller-manager
      port: 10257
      protocol: TCP
      targetPort: 10257
  selector:
    app.kubernetes.io/name: kube-apiserver
