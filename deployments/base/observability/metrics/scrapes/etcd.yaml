apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: etcd
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/instance
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-metrics
  endpoints:
    - port: metrics
