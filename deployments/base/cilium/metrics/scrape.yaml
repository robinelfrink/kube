apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium
  namespace: cilium
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cilium
  podMetricsEndpoints:
    - port: prometheus
      metricRelabelConfigs:
      - sourceLabels: [__name__, reason]
        regex: 'cilium_drop_count_total;(Unsupported L3 protocol|Unsupported L3 protocol)'
        action: drop
