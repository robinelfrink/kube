apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubevirt
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
patches:
  - target:
      kind: Deployment
      name: virt-operator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
