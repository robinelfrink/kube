apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubevirt-manager
  namespace: kubevirt
  labels:
    app: kubevirt-manager
    kubevirt-manager.io/version: v1.5.4
  annotations:
    # If you are using OAUTH, make sure Proxy Buffers are big enougth
    nginx.org/location-snippets: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
{% if 'issuer' in config.base.kubevirt.manager %}
    cert-manager.io/cluster-issuer: {{ config.base.kubevirt.manager.issuer }}
{% endif %}
spec:
  tls:
    - hosts:
        - {{ config.base.kubevirt.manager.hostname }}
      secretName: kubevirt-manager-tls
  rules:
    - host: {{ config.base.kubevirt.manager.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubevirt-manager
                port:
                  number: 8080
