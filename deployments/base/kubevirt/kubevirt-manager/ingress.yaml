apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubevirt-manager
  namespace: kubevirt
  labels:
    app: kubevirt-manager
    kubevirt-manager.io/version: v1.5.4
{% if get_var('config.base.kubevirt.manager.authentication.enabled') or 'issuer' in config.base.kubevirt.manager %}
  annotations:
{%   if get_var('config.base.kubevirt.manager.authentication.enabled') %}
    haproxy-ingress.github.io/auth-realm: Access Limited
    haproxy-ingress.github.io/auth-secret: kubevirt-manager
{%   endif %}
{%   if 'issuer' in config.base.kubevirt.manager %}
    cert-manager.io/cluster-issuer: {{ config.base.kubevirt.manager.issuer }}
{%   endif %}
{% endif %}
spec:
  tls:
    - hosts:
        - {{ config.base.kubevirt.manager.hostname }}
      secretName: kubevirt-manager-tls
  rules:
    - host: {{ config.base.kubevirt.manager.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubevirt-manager
                port:
                  number: 8080
