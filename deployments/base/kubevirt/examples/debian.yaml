apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: debian
  namespace: virtualmachines
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: debian-boot
      spec:
        source:
          registry:
            url: "docker://quay.io/containerdisks/debian:13"
        storage:
          storageClassName: seaweed
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 60Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: debian
    spec:
      networks:
        - name: default
          pod: {}
      domain:
        devices:
          disks:
            - name: bootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 16Gi
        cpu:
          cores: 4
        memory:
          guest: 16Gi
      volumes:
        - name: bootdisk
          dataVolume:
            name: debian-boot
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              ssh_authorized_keys:
                - ssh-rsa 
