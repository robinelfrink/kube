apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helm-rendered.yaml

{% if 'operator.victoriametrics.com' in apigroups %}
patches:
  - patch: |-
      target:
        group: monitoring.coreos.com
        version: v1
        kind: ServiceMonitor
      patch: |-
        - op: replace
          path: /group
          value: operator.victoriametrics.com
        - op: replace
          path: /version
          value: v1beta1
        - op: replace
          path: /kind
          value: VMServiceScrape
{% endif %}
