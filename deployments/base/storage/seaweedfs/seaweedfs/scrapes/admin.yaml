apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: seaweedfs-admin
  namespace: storage
spec:
  endpoints:
    - interval: 2m
      port: http
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: admin
