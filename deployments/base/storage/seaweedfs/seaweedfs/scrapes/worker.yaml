apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: seaweedfs-worker
  namespace: storage
spec:
  endpoints:
    - interval: 2m
      port: metrics
      scrapeTimeout: 10s
    - interval: 2m
      port: lance-metrics
      scrapeTimeout: 5s
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: worker
