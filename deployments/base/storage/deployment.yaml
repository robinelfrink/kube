{%- if config.base.storage.classes | default([]) | length > 0 %}
deployments:
  - path: namespace
    waitReadiness: true
{%-   for class in config.base.storage.classes %}
  - path: {{ class.type }}
    recursive: true
    vars:
      - values:
          storage: {{ class }}
{%-   endfor %}
{%- endif %}
