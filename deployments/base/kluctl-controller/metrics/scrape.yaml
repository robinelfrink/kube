apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: kluctl-controller
  namespace: kluctl-system
spec:
  namespaceSelector:
    matchNames:
      - kluctl-system
  selector:
    matchLabels:
      control-plane: kluctl-controller
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
      - target_label: job
        replacement: kluctl-controller
        action: replace
