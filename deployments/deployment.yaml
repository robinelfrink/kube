vars:
  - file: ../clusters/example.yaml
    targetPath: config
  - clusterSecret:
      name: config
      namespace: config
      key: config
    targetPath: config
    when: get_var('args.component') != 'base/config' and get_var('args.source', 'cluster') != 'local'
  - file: ../clusters/{{ args.cluster }}.yaml
    targetPath: config
    when: get_var('args.component') == 'base/config' or get_var('args.source', 'cluster') == 'local'

deployments:
  - include: {{ args.component }}
